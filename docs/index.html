<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samsung Electronics (005930.KS) — Price &amp; VWAP Dashboard</title>
  <meta name="description" content="Daily closing prices, trading volumes and trailing VWAPs for Samsung Electronics (KRX: 005930, KOSPI)." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">
      <h1>Samsung Electronics <span class="ticker">005930.KS</span></h1>
      <p class="topbar__sub" id="last-updated">Loading market data…</p>
    </div>
    <a class="topbar__source" href="https://github.com/tindone/samsung-price" target="_blank" rel="noopener">Data source ↗</a>
  </header>

  <main class="dashboard">
    <section class="stats" id="stats" aria-label="Latest values">
      <div class="stat" data-key="close">
        <span class="stat__label">Close</span>
        <span class="stat__value" data-field="close">—</span>
        <span class="stat__date" data-field="as_of">—</span>
      </div>
      <div class="stat stat--accent" data-key="mean">
        <span class="stat__label">VWAP Mean</span>
        <span class="stat__value" data-field="vwap_mean">—</span>
        <span class="stat__date" data-field="mean_date">—</span>
      </div>
      <div class="stat" data-key="vwap_7d">
        <span class="stat__label">VWAP 7D</span>
        <span class="stat__value" data-field="vwap_7d">—</span>
        <span class="stat__meta" data-field="days_7d">— days</span>
      </div>
      <div class="stat" data-key="vwap_1m">
        <span class="stat__label">VWAP 1M</span>
        <span class="stat__value" data-field="vwap_1m">—</span>
        <span class="stat__meta" data-field="days_1m">— days</span>
      </div>
      <div class="stat" data-key="vwap_2m">
        <span class="stat__label">VWAP 2M</span>
        <span class="stat__value" data-field="vwap_2m">—</span>
        <span class="stat__meta" data-field="days_2m">— days</span>
      </div>
    </section>

    <section class="chart-card">
      <div id="chart" class="chart" role="img" aria-label="Price, volume and VWAP chart"></div>
      <p id="status" class="chart-card__status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer class="footer">
    <span>Auto-updated daily via GitHub Actions · data from Yahoo Finance</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
