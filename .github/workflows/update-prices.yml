name: Update Samsung prices

# Runs every weekday at 8:23 PM KST (UTC+9) = 11:23 UTC, Mon–Fri.
# Also runnable on demand from the Actions tab.
on:
  #schedule:
  #  - cron: '23 11 * * 1-5'
  workflow_dispatch:
  repository_dispatch:
    types:
      - cloudflare-worker

# The auto-commit step pushes back to the repo, so the default
# GITHUB_TOKEN needs write access to contents.
permissions:
  contents: write

# Avoid overlapping runs if a manual trigger collides with the schedule.
concurrency:
  group: update-samsung-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Determine effective date
        run: |
          # The scheduled run fires at 9:00 PM KST (12:00 UTC), after the
          # Korean market has closed and Yahoo has published the day's
          # closing prices. A manual workflow_dispatch fired earlier in the
          # day would find today's close not yet available, so before the
          # 9 PM KST threshold we treat the run as belonging to the
          # previous day instead.
          if [ "$(date -u +%H%M)" -lt 1200 ]; then
            END=$(date -u -d "yesterday" +%Y-%m-%d)
          else
            END=$(date -u +%Y-%m-%d)
          fi
          # Rolling 30-day window. The script merges new rows into the
          # existing CSV (deduplicated by date), so missed/failed runs catch
          # up on their own and VWAPs are computed from the full accumulated
          # history.
          START=$(date -u -d "$END -30 days" +%Y-%m-%d)
          echo "END=$END"   >> "$GITHUB_ENV"
          echo "START=$START" >> "$GITHUB_ENV"
          echo "Effective date range: $START .. $END"

      - name: Fetch latest prices and compute VWAPs
        run: |
          echo "Fetching 005930.KS from $START to $END"
          python3 scripts/fetch_prices.py \
            --ticker 005930 \
            --market kospi \
            --start "$START" \
            --end "$END"

      - name: Commit and push changes
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit for $END."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update 005930.KS prices, VWAPs and PSU ($END)"
            git push
            echo "Pushed updates for $END."
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Posts the latest PSU evaluation (mirrors the "PSU Expected Grant"
      # section of docs/index.html) as a comment on Discussion #1. The comment
      # is authored by a GitHub App bot — a distinct identity from the repo
      # owner — because GitHub never notifies a user about their own comments,
      # so a PAT owned by the repo owner would be silent. Requires a GitHub App
      # installed on this repository with the "Discussions" permission set to
      # Read & write, plus two repository secrets: BOT_APP_ID (the app's
      # numeric ID) and BOT_APP_PRIVATE_KEY (the app's PEM private key).
      # actions/create-github-app-token mints a short-lived installation access
      # token that post_psu_discussion.py consumes via DISCUSSIONS_TOKEN exactly
      # like a PAT. Skipped on no-op runs (nothing new to report).
      - name: Get bot installation token
        id: bot-token
        if: steps.commit.outputs.pushed == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Post PSU evaluation to Discussion #1
        if: steps.commit.outputs.pushed == 'true'
        env:
          DISCUSSIONS_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          python3 scripts/post_psu_discussion.py
