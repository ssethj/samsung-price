name: Update Samsung prices

# Runs every weekday at 9:00 PM KST (UTC+9) = 12:00 UTC, Mon–Fri.
# Also runnable on demand from the Actions tab.
on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

# The auto-commit step pushes back to the repo, so the default
# GITHUB_TOKEN needs write access to contents.
permissions:
  contents: write

# Avoid overlapping runs if a manual trigger collides with the schedule.
concurrency:
  group: update-samsung-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch latest prices and compute VWAPs
        run: |
          # Rolling 30-day window. The script merges new rows into the existing
          # CSV (deduplicated by date), so missed/failed runs catch up on their
          # own and VWAPs are computed from the full accumulated history.
          START=$(date -u -d "30 days ago" +%Y-%m-%d)
          END=$(date -u +%Y-%m-%d)
          echo "Fetching 005930.KS from $START to $END"
          python3 scripts/fetch_prices.py \
            --ticker 005930 \
            --market kospi \
            --start "$START" \
            --end "$END"

      - name: Commit and push changes
        id: commit
        run: |
          END=$(date -u +%Y-%m-%d)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit for $END."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update 005930.KS prices, VWAPs and PSU ($END)"
            git push
            echo "Pushed updates for $END."
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Posts the latest PSU evaluation (mirrors the "PSU Expected Grant"
      # section of docs/index.html) as a comment on Discussion #1. Requires a
      # PAT secret named DISCUSSIONS_TOKEN (classic PAT: `repo` scope; or a
      # fine-grained token with Discussions read+write on this repo) — the
      # default GITHUB_TOKEN cannot write discussions. Skipped on no-op runs
      # (nothing new to report) and when the secret is absent.
      - name: Post PSU evaluation to Discussion #1
        if: steps.commit.outputs.pushed == 'true'
        env:
          DISCUSSIONS_TOKEN: ${{ secrets.DISCUSSIONS_TOKEN }}
        run: |
          python3 scripts/post_psu_discussion.py
